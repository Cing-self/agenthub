name: LobsterMobile
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.dolphin.platform.ios
    SWIFT_VERSION: 5.10
    INFOPLIST_FILE: Sources/Resources/Info.plist
    DEVELOPMENT_TEAM: ""
targets:
  LobsterMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: LobsterMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: 与 Lobster 进行语音对话需要使用麦克风。
        NSSpeechRecognitionUsageDescription: 将语音转成文字需要使用语音识别。
        NSCameraUsageDescription: 后续视频与拍照功能需要使用摄像头。
    scheme:
      testTargets: []
